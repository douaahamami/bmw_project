```html
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>BMW - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Menu de navigation -->

    <header>

        <h1>BMW</h1>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="modeles.html">Modèles</a>
            <a href="apropos.html">À propos</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- Section Contact -->

    <section class="contact">

        <h2>Contactez-nous</h2>

        <p>
            Vous avez une question ?
            Notre équipe est à votre écoute.
        </p>


        <!-- Formulaire -->

        <form>

            <label for="nom">Nom complet</label>

            <input type="text" id="nom" placeholder="Entrez votre nom">


            <label for="email">Adresse email</label>

            <input type="email" id="email" placeholder="Entrez votre email">


            <label for="sujet">Sujet</label>

            <select id="sujet">

                <option>Choisir un sujet</option>

                <option>Informations sur un modèle</option>

                <option>Demande de renseignements</option>

                <option>Autre</option>

            </select>


            <label for="message">Votre message</label>

            <textarea id="message" placeholder="Écrivez votre message"></textarea>


            <button type="submit">Envoyer le message</button>

        </form>

    </section>

</body>

</html>
